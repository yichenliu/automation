<form class="studio-ask only-standalone" data-studio-ask data-send="{{ url_for('builder.send', wid=ws.id) }}" data-poll="/w/{{ ws.id }}/chat/" data-page="{{ request.url.path }}">
  {{ icon('sparkles') }}<label class="sr-only" for="studio-ask-text">Tell the AI what to change</label>
  <textarea id="studio-ask-text" name="text" rows="1" autocomplete="off" maxlength="2000" placeholder="{{ ask_hint|default('Say what should change, in your own words') }}"></textarea>
  <button class="btn primary sm">Change it</button>
  <p class="studio-ask-help">{% if ask_example %}For example: “{{ ask_example }}”. {% endif %}The AI makes the change and tells you what it did. Every change can be undone.</p>
  <div class="studio-ask-said small" hidden></div>
</form>
