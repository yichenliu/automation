{% extends "base.html" %}{% from "macros.html" import flashes %}
{% block title %}Choose a new password{% endblock %}
{% block body %}
<div class="centered"><div class="card auth-card">
  <div class="brand"><span class="mark">{{ platform_name[0] }}</span>{{ platform_name }}</div>
  <h1 class="mt-3">Choose a new password</h1><p class="muted mt-1">For {{ user.email }}.</p>
  <form method="post" class="stack mt-3">{{ flashes() }}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span>New password</span><input type="password" name="password" minlength="10" required autofocus autocomplete="new-password"></label>
    <button class="btn primary block">Save it</button></form>
</div></div>
{% endblock %}
